services:
  nginx:
    image: nginx:alpine
    container_name: reconai-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_healthy
    networks:
      - reconai-net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: reconai-backend
    restart: unless-stopped
    environment:
      - PORT=8000
      - HOST=0.0.0.0
      - CORS_ORIGINS=*
      - RECON_DATA_DIR=/app/data
      - RECON_MODELS_DIR=/app/models
    volumes:
      - ./data:/app/data
      - ./models:/app/models
    networks:
      - reconai-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ""
    container_name: reconai-frontend
    restart: unless-stopped
    environment:
      - PORT=3000
      - NEXT_PUBLIC_API_URL: ""
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - reconai-net
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  reconai-net:
    driver: bridge
